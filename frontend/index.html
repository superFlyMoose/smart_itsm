<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Smart ITSM 智能 IT 服务管理系统" />
    <title>Smart ITSM - 智能 IT 服务管理</title>
    <script>
      // 在首屏渲染前应用主题，避免暗色模式闪烁
      try {
        var saved = localStorage.getItem('itsm-theme')
        var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches
        if (saved === 'dark' || (!saved && prefersDark)) {
          document.documentElement.classList.add('dark')
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
