spring.application.name=smart-itsm
server.port=${SERVER_PORT:8080}

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/smart_itsm?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:123456}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:20}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:5}

spring.data.redis.host=${REDIS_HOST:192.168.64.135}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=3s
spring.data.redis.connect-timeout=3s

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
spring.rabbitmq.connection-timeout=3s
spring.rabbitmq.listener.simple.default-requeue-rejected=false

spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=Asia/Shanghai
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB

mybatis-plus.configuration.map-underscore-to-camel-case=true
mybatis-plus.configuration.default-enum-type-handler=org.apache.ibatis.type.EnumTypeHandler
mybatis-plus.global-config.db-config.id-type=auto

smart-itsm.security.jwt-secret=${JWT_SECRET:SmartItsmJwtSecretKeyMustBeAtLeast32BytesLong2026}
smart-itsm.security.jwt-expiration-seconds=${JWT_EXPIRATION_SECONDS:7200}
smart-itsm.storage.upload-dir=${UPLOAD_DIR:uploads}
smart-itsm.rabbitmq.exchange=${ITSM_EXCHANGE:smart.itsm.exchange}
smart-itsm.rabbitmq.notification-queue=${ITSM_NOTIFICATION_QUEUE:smart.itsm.notification.queue}
smart-itsm.rabbitmq.notification-routing-key=${ITSM_NOTIFICATION_ROUTING_KEY:notification}
smart-itsm.rabbitmq.ai-queue=${ITSM_AI_QUEUE:smart.itsm.ai.task.queue}
smart-itsm.rabbitmq.ai-routing-key=${ITSM_AI_ROUTING_KEY:ai.task}
